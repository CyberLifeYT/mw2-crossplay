# Builds the multiplayer APK for this fork from the private assets repo.
#
# Builds one game version at a time (`tu` input: tu0 disc, tu6 title update):
# TU0 recompiles default_mp.xex itself -- ppc_mp_tu0/ is generated, never
# committed -- TU6 additionally fetches the update package and recompiles the
# patched executable into ppc_mp/. Both build the multiplayer flavor
# (-DMW2_TITLE=mp -DMW2_ONLINE=lan, see android/app/build.gradle.kts).
#
# Needs two secrets (both masked in logs):
#   GAME_ARCHIVE_URL  PLAIN raw URL, no credentials, e.g.
#                     https://raw.githubusercontent.com/<you>/mw2-assets/main/mw2-xex-tu0.zip
#   MW2_ASSETS_TOKEN  fine-grained PAT with Contents read-only on the assets
#                     repo; sent as an Authorization header (fetch_asset.py
#                     reads HTTP_AUTHORIZATION). Never embed it in the URL.
# The URL is masked in logs, and mw2/ is deleted off the runner before the
# APK is built, so no game file can end up in an artifact.
#
# First run is long (MP recompile ~1h + cold NDK compile); ppc_mp_tu0/ and
# ccache are cached, so re-running after a timeout resumes rather than
# restarting.
name: Build MP APK

on:
  workflow_dispatch:
    inputs:
      tu:
        description: "Which game version to build"
        type: choice
        options: [tu0, tu6]
        default: tu0
      probe_addrs:
        description: "Analyser probe addresses, e.g. 0x8242C630 0x82428180 (tu6 only; forces a fresh recompile and prints address-only bounds/flow/tables)"
        default: ""

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Make room on the disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost /usr/share/swift \
                      /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 ninja-build ccache cmake \
                                  python3 p7zip-full

      - name: Install the NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" \
                                  "build-tools;35.0.0" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "installed NDK $NDK_VERSION"

      - name: Fetch libadrenotools
        run: ./android/fetch_deps.sh

      - name: Which game version
        id: tu
        run: |
          tu="${{ github.event.inputs.tu }}"
          [ -n "$tu" ] || tu="tu0"
          echo "tu=$tu" >> "$GITHUB_OUTPUT"
          echo "building $tu"

      - name: Fetch the game's executables
        id: fetch
        env:
          # Plain URL, NO credentials in it (they break URL parsing and leak).
          # The token travels as an Authorization header instead.
          ARCHIVE_URL: ${{ secrets.GAME_ARCHIVE_URL }}
          MW2_ASSETS_TOKEN: ${{ secrets.MW2_ASSETS_TOKEN }}
          HTTP_AUTHORIZATION: Bearer ${{ secrets.MW2_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ARCHIVE_URL" ]; then
            echo "::error::GAME_ARCHIVE_URL secret is empty. See CROSSPLAY.md."
            exit 1
          fi
          if [ -z "${MW2_ASSETS_TOKEN:-}" ]; then
            echo "::error::MW2_ASSETS_TOKEN secret is empty (fine-grained PAT, Contents read on the assets repo). See CROSSPLAY.md."
            exit 1
          fi
          case "$ARCHIVE_URL" in
            *@*) echo "::error::GAME_ARCHIVE_URL must be the PLAIN raw URL without credentials; the token goes in MW2_ASSETS_TOKEN."; exit 1 ;;
          esac
          echo "::add-mask::$ARCHIVE_URL"
          python3 tools/fetch_asset.py --into mw2 --github-output \
            --require default.xex,default_mp.xex "$ARCHIVE_URL"
          # Disc version (TU0): the executables live in mw2/tu0/.
          mkdir -p mw2/tu0
          cp mw2/default.xex mw2/default_mp.xex mw2/tu0/
          if [ "${{ steps.tu.outputs.tu }}" = "tu6" ]; then
            # The patch step below only runs when mw2/*.xex are absent: the
            # fetched disc copies must NOT sit there or the "TU6" build
            # silently recompiles unpatched disc bytes. Remove them so
            # xexpatch runs (same guard as Build PC TU6).
            rm -f mw2/default.xex mw2/default_mp.xex mw2/default.pe mw2/default_mp.pe
            curl -sSL -H "Authorization: Bearer $MW2_ASSETS_TOKEN" \
              "https://raw.githubusercontent.com/CyberLifeYT/mw2-assets/main/title-updates/TU6/TU_10LC20N_0000018000000.00000000001GA" \
              -o tu6.pkg
            if [ ! -s tu6.pkg ]; then echo "::error::TU6 package did not download."; exit 1; fi
            echo "TU6 package: $(du -h tu6.pkg | cut -f1)"
          fi

      - name: Restore the recompiled MP tree (tu0)
        id: ppc_cache_tu0
        if: steps.tu.outputs.tu == 'tu0'
        uses: actions/cache@v4
        with:
          path: |
            ppc_mp_tu0
            .xex-sha256
          key: ppc-mp-tu0-${{ steps.fetch.outputs.assets_key }}-${{ hashFiles('build.sh', 'patches/**', 'config/MW2MP.tu0.toml', 'tools/genshared.py', 'tools/gen_kernel_stubs.py') }}

      - name: Restore the recompiled MP tree (tu6)
        id: ppc_cache_tu6
        if: steps.tu.outputs.tu == 'tu6'
        uses: actions/cache@v4
        with:
          path: |
            ppc_mp
            .xex-sha256-tu6
            .tu6-hashes
          key: ppc-mp-tu6-h2-${{ steps.fetch.outputs.assets_key }}-${{ hashFiles('build.sh', 'patches/**', 'config/MW2MP.toml', 'tools/genshared.py', 'tools/gen_kernel_stubs.py') }}${{ inputs.probe_addrs != '' && '-probe' || '' }}

      - name: Cache the XenonRecomp build
        uses: actions/cache@v4
        with:
          path: XenonRecomp
          key: xenonrecomp-${{ hashFiles('build.sh', 'patches/**') }}

      - name: Recompile the MP executable (disc TU0)
        if: steps.tu.outputs.tu == 'tu0' && steps.ppc_cache_tu0.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=tu0 RECOMPILE_ONLY=1 TITLE=mp ISO=mw2/game.iso ./build.sh

      - name: Recompile the MP executable (TU6)
        if: steps.tu.outputs.tu == 'tu6' && steps.ppc_cache_tu6.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=tu6 RECOMPILE_ONLY=1 TU=$PWD/tu6.pkg TITLE=mp ISO=mw2/game.iso ./build.sh

      - name: Probe analyser bounds (tu6)
        # Address-only diagnosis for runtime "no recompiled function" gaps:
        # where each address lives (.pdata/starts), control flow around it,
        # nearby jump tables, and fixbounds' own config-entry suggestions.
        # Prints addresses only, never game bytes; never fails the job.
        if: steps.tu.outputs.tu == 'tu6' && inputs.probe_addrs != ''
        run: |
          echo "===== bracket ${{ inputs.probe_addrs }} ====="
          MW2_TITLE=mp MW2_VERSION=tu6 python3 tools/bracket.py ${{ inputs.probe_addrs }} || true
          for a in ${{ inputs.probe_addrs }}; do
            lo=$(printf '0x%X' $(($a - 0x100)))
            hi=$(printf '0x%X' $(($a + 0x100)))
            echo "===== flow $lo..$hi ====="
            MW2_TITLE=mp MW2_VERSION=tu6 python3 tools/bracket.py --flow $lo $hi || true
            echo "===== tables near $a ====="
            python3 tools/tables_near.py config/mw2mp_switch_tables.toml "$a" || true
          done
          echo "===== fixbounds suggestions ====="
          MW2_TITLE=mp MW2_VERSION=tu6 python3 tools/fixbounds.py config/mw2mp_switch_tables.toml logs-recomp-mp-tu6.txt || true
          true

      - name: Verify the TU patch applied (tu6 only)
        if: steps.tu.outputs.tu == 'tu6'
        run: |
          for x in default default_mp; do
            disc=$(sha256sum "mw2/tu0/$x.xex" | cut -d' ' -f1)
            built=$(sha256sum "mw2/$x.xex" | cut -d' ' -f1)
            echo "$x disc: $disc"
            echo "$x tu6:  $built"
            if [ "$disc" = "$built" ]; then
              echo "::error::$x.xex is byte-identical to the disc: the TU patch did not apply."
              exit 1
            fi
          done

      - name: Note the executables' hashes and let go of the game files
        run: |
          set -euo pipefail
          if [ "${{ steps.tu.outputs.tu }}" = "tu6" ]; then
            # Patched files exist only right after a recompile; on a cache
            # hit the full set comes from the cached hashes file instead.
            if [ -f mw2/default.xex ] && [ -f mw2/update/patch_mp.ff ]; then
              sp=$(sha256sum mw2/default.xex | cut -d' ' -f1)
              mp=$(sha256sum mw2/default_mp.xex | cut -d' ' -f1)
              dsp=$(sha256sum mw2/tu0/default.xex | cut -d' ' -f1)
              dmp=$(sha256sum mw2/tu0/default_mp.xex | cut -d' ' -f1)
              p=$(sha256sum mw2/update/patch_mp.ff | cut -d' ' -f1)
              d1=$(sha256sum mw2/update/dlc1_ui_mp.ff | cut -d' ' -f1)
              d2=$(sha256sum mw2/update/dlc2_ui_mp.ff | cut -d' ' -f1)
              printf '%s\n' "$sp" "$mp" "$dsp" "$dmp" "$p" "$d1" "$d2" > .tu6-hashes
              printf '%s %s\n' "$sp" "$mp" > .xex-sha256-tu6
            elif [ -f .tu6-hashes ]; then
              sp=$(sed -n 1p .tu6-hashes); mp=$(sed -n 2p .tu6-hashes)
              dsp=$(sed -n 3p .tu6-hashes); dmp=$(sed -n 4p .tu6-hashes)
              p=$(sed -n 5p .tu6-hashes); d1=$(sed -n 6p .tu6-hashes); d2=$(sed -n 7p .tu6-hashes)
            else
              echo "::error::TU6 files are missing and no hashes were cached."
              exit 1
            fi
            echo "MW2_XEX_SHA256_SP=$sp" >> "$GITHUB_ENV"
            echo "MW2_XEX_SHA256_MP=$mp" >> "$GITHUB_ENV"
            echo "MW2_DISC_SHA256_SP=$dsp" >> "$GITHUB_ENV"
            echo "MW2_DISC_SHA256_MP=$dmp" >> "$GITHUB_ENV"
            echo "MW2_UPDATE_SHA256_PATCH_MP=$p" >> "$GITHUB_ENV"
            echo "MW2_UPDATE_SHA256_DLC1_UI_MP=$d1" >> "$GITHUB_ENV"
            echo "MW2_UPDATE_SHA256_DLC2_UI_MP=$d2" >> "$GITHUB_ENV"
          elif [ -f mw2/default.xex ] && [ -f mw2/default_mp.xex ]; then
            sp=$(sha256sum mw2/default.xex | cut -d' ' -f1)
            mp=$(sha256sum mw2/default_mp.xex | cut -d' ' -f1)
            printf '%s %s\n' "$sp" "$mp" > .xex-sha256
            echo "MW2_XEX_SHA256_SP=$sp" >> "$GITHUB_ENV"
            echo "MW2_XEX_SHA256_MP=$mp" >> "$GITHUB_ENV"
          elif [ -f .xex-sha256 ]; then
            read -r sp mp < .xex-sha256
            echo "MW2_XEX_SHA256_SP=$sp" >> "$GITHUB_ENV"
            echo "MW2_XEX_SHA256_MP=$mp" >> "$GITHUB_ENV"
          else
            echo "::error::The two executables are missing and no hashes were cached."
            exit 1
          fi
          rm -rf mw2
          df -h / | tail -1

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        id: ccache_restore
        with:
          path: .ccache
          key: ccache-android-mp-${{ steps.tu.outputs.tu }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-mp-${{ steps.tu.outputs.tu }}-
            ccache-android-mp-
            ccache-android-

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the multiplayer APK
        working-directory: android
        env:
          MW2_NDK_VERSION: ${{ env.NDK_VERSION }}
          MW2_BUILD_SHA: ${{ github.sha }}
          MW2_NATIVE_OPTIMISATION: -O2
          MW2_COMPILER_LAUNCHER: ccache
        run: |
          set -euo pipefail
          tu="${{ steps.tu.outputs.tu }}"
          case "$tu" in
            tu6) variant="MultiplayerTu6" ;;
            *)   variant="MultiplayerTu0" ;;
          esac
          export MW2_BUILD_SHA="${MW2_BUILD_SHA::7}"
          export MW2_BUILD_STAMP="$(date -u '+%Y-%m-%d %H:%M') UTC, run ${{ github.run_number }}"
          echo "building $variant ($MW2_BUILD_SHA, $tu)"
          gradle --no-daemon --stacktrace assemble${variant}Release
          ccache --show-stats || true

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-android-mp-${{ steps.tu.outputs.tu }}-${{ github.run_id }}

      - name: Collect the apk
        run: |
          set -euo pipefail
          mkdir -p dist
          tu="${{ steps.tu.outputs.tu }}"
          stamp=$(date -u +%Y%m%d)
          short=${GITHUB_SHA::7}
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "::group::what Gradle produced"
          find android/app/build/outputs/apk -name "*.apk" -printf "%s\t%p\n" | sort -k2 || true
          echo "::endgroup::"
          got=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$got" ]; then
            echo "::error::no APK was built. See the list above for what was."
            exit 1
          fi
          if ! "$tools/apksigner" verify "$got" > /dev/null 2>&1; then
            echo "::error::$got is not signed; Android would refuse it."
            "$tools/apksigner" verify --verbose "$got" || true
            exit 1
          fi
          cp "$got" "dist/mw2-multiplayer-android-arm64-$stamp-$short-$tu.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Verify the apk
        run: |
          set -euo pipefail
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in dist/*.apk; do
            echo "::group::$apk"
            ls -la "$apk"
            unzip -t "$apk" > /dev/null && echo "zip: intact"
            "$tools/apksigner" verify --verbose "$apk" || {
              echo "::error::$apk is not correctly signed"
              exit 1
            }
            "$tools/aapt2" dump badging "$apk" | grep -E "^package:|sdkVersion:|native-code:" || true
            echo "::endgroup::"
          done

      # Symbol map of the shipped library: function names + addresses only
      # (no game content, same class as the existing diagnostics). Lets the
      # next device crash log resolve to the exact function offline.
      - name: Upload symbol map
        run: |
          set -euo pipefail
          mkdir -p dist
          lib=$(find android/app/build -path "*obj*arm64-v8a/libmw2.so" | head -1)
          if [ -z "$lib" ]; then lib=$(find android/app/build -path "*arm64-v8a/libmw2.so" | head -1); fi
          echo "unstripped library: $lib"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -n "$lib" > "dist/symbols-${{ steps.tu.outputs.tu }}.txt" || true
          grep -c " sub_" "dist/symbols-${{ steps.tu.outputs.tu }}.txt" || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-mp-apk-${{ steps.tu.outputs.tu }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Say what came out
        run: |
          {
            echo "### MP build (${{ steps.tu.outputs.tu }}, LAN backend)"
            echo
            echo "build \`${GITHUB_SHA::7}\` (run ${{ github.run_number }})"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Install in com.mw2.recomp.mp from the FULL disc ISO (not lean)."
          } >> "$GITHUB_STEP_SUMMARY"
