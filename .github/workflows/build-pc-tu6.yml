      - uses: actions/upload-artifact@v4
        with:
          name: pc-windows-tu6
          path: dist/*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Upload to release
        if: ${{ github.event.inputs.upload_release == true || github.event.inputs.upload_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*; do
            gh release upload "${{ inputs.release_tag }}" "$f" --clobber -R "${{ github.repository }}" || echo "upload skipped for $f"
          done
