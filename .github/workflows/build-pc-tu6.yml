              # Jump tables the analyser recorded near the label: a table
              # dispatching into a loop tail splits it away from its branch.
              if [ "$title" = sp ]; then tables=config/mw2_switch_tables.toml;
              else tables=config/mw2mp_switch_tables.toml; fi
              for label in $labels; do
                echo "----- tables near $label -----"
                python3 tools/tables_near.py "$tables" "$label" || true
              done
            fi
          done

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-pc-tu6-windows-${{ github.run_id }}

      - name: Package
        run: |
          set -euo pipefail
          rm -rf mw2
          mkdir -p dist
          name=mw2-${{ inputs.release_tag }}-windows-tu6-lan
          mkdir -p $name
          cp out/sp/mw2.exe $name/mw2-sp.exe
          cp out/mp/mw2.exe $name/mw2-mp.exe
          cp out/sp/mw2-launcher.exe $name/mw2-launcher.exe
