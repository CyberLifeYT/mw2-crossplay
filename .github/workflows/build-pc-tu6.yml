            echo "$x tu6:  $built"
            if [ "$disc" = "$built" ]; then
              echo "::error::$x.xex is byte-identical to the disc: the TU patch did not apply."
              exit 1
            fi
          done

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-pc-tu6-windows-${{ github.run_id }}
          restore-keys: |
            ccache-pc-tu6-windows-

      - name: Build (sp offline, mp lan)
        run: |
          set -euo pipefail
          export CMAKE_EXTRA="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DFETCHCONTENT_BASE_DIR=$PWD/out/_deps"
          WINDOWS=1 VERSION=tu6 TU=$PWD/tu6.pkg TITLE=sp ONLINE=none RELEASE=1 RELEASE_TAG=${{ inputs.release_tag }} BUILD_DIR=out/sp ./build.sh 2>&1 | tee logs-build-sp-tu6.txt
          WINDOWS=1 VERSION=tu6 TU=$PWD/tu6.pkg TITLE=mp ONLINE=lan RELEASE=1 RELEASE_TAG=${{ inputs.release_tag }} BUILD_DIR=out/mp ./build.sh 2>&1 | tee logs-build-mp-tu6.txt
          ccache --show-stats || true

